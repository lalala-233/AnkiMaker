[package]
name = "anki_maker"
version = "0.8.1"
edition = "2024"
default-run = "ankimaker"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
eframe = { version = "0.31", features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",

], optional = true }

[[bin]]
name = "ankimaker"
path = "src/main.rs"

[features]
gui = ["eframe"]
