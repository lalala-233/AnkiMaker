[package]
name = "anki_maker"
version = "0.8.8"
edition = "2024"
default-run = "ankimaker"

[dependencies]
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"


[[bin]]
name = "ankimaker"
path = "src/main.rs"

[profile.release]
strip = true